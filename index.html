<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arena Strike - a lightweight browser FPS built with Babylon.js" />
    <title>Arena Strike</title>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game-canvas" aria-label="Arena Strike game viewport" tabindex="0"></canvas>

      <section id="weapon-hud" aria-label="Weapon status">
        <div id="damage-overlay" aria-hidden="true"></div>
        <div id="crosshair" aria-hidden="true"></div>
        <div id="hit-marker" aria-hidden="true">&times;</div>
        <p id="combat-message" role="status" aria-live="polite" hidden></p>

        <section id="score-panel" aria-label="Elimination score">
          <span class="score-side player-score-side">Player</span>
          <strong id="player-score">0</strong>
          <span class="score-divider">:</span>
          <strong id="bot-score">0</strong>
          <span class="score-side bot-score-side">Bot</span>
        </section>

        <section id="combat-health-hud" aria-label="Combat health">
          <div class="health-card">
            <div class="health-heading">
              <span>Player</span>
              <strong id="player-health">100</strong>
            </div>
            <div class="health-track" aria-hidden="true">
              <span id="player-health-fill" class="health-fill player-health-fill"></span>
            </div>
          </div>

          <div class="health-card bot-health-card">
            <div class="health-heading">
              <span>Bot</span>
              <strong id="bot-health">100</strong>
            </div>
            <div class="health-track" aria-hidden="true">
              <span id="bot-health-fill" class="health-fill bot-health-fill"></span>
            </div>
          </div>
        </section>

        <div id="ammo-panel">
          <span id="ammo-count">30 / 90</span>
          <span id="reload-status" hidden>Reloading...</span>
        </div>
      </section>

      <p id="controls-hint">
        Click to aim | WASD move | Shift sprint | Space jump | Left click fire | R reload | Esc unlock
      </p>

      <section id="status-overlay" class="status-overlay" role="status" aria-live="polite">
        <div class="status-card">
          <p class="eyebrow">Arena Strike</p>
          <h1 id="status-title">Loading game</h1>
          <p id="status-message">Preparing the Babylon.js scene...</p>
          <div id="loading-indicator" class="loading-indicator" aria-hidden="true"></div>
          <button id="retry-button" class="retry-button" type="button" hidden>Retry</button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
